<p>Here's my fibonacci calculator.</p>
<div class="first-para">
<label for="n">number of terms</label><input min="0" class="form-control" id="n" [(ngModel)]="n" type="number">
</div>
<br>

<button class="btn btn-primary" (click)="compute()">calculate</button> <br>
<div class="result-container">
<label for="result">result</label>
<div class="result" id="result" [innerHtml]="result"></div>
</div>
